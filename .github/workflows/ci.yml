# isRunGreen() requires EVERY blocking job to be `success`, so a job absent from `needs` is one whose
# failure the anchor silently forgets and the run still reads green.
# tests/regression/SES-255-ci-conclusion-reporting.js computes that set from this file rather than
# hardcoding it, so a fourth job added without adding it here fails the suite.
#
# DeepBench v7.0.304 | .github/workflows/ci.yml | SES-180 (d) — THE REGRESSION STEP IS ACTUALLY
# CREDENTIALED, and the thing to read twice is that this ship exists because the header below was
# WRONG. John, attended architect session 2026-08-29, directive 82403dad, after reading this file at
# e8432f3 with the secrets already added: the v7.0.286 caveat's closing sentence — "adding the
# secrets later makes the gate stronger with no edit to this file" — is FALSE, and it is corrected
# in place below rather than left standing as a lie above true code.
#
# WHY IT WAS FALSE, and it is a property of GitHub Actions rather than a slip of wording: a
# repository secret is NEVER auto-exposed to a step. `secrets.*` resolves only where it is written,
# and the step that runs the suite carried no `env:` block at all. So both repository secrets could
