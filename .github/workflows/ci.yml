# nothing in the run would have said so: a not-run declaration looks identical whether the secret
# is missing or merely unexposed. THAT is why the sentence had to be corrected and not just
# out-grown — it described a future that could not arrive on its own.
#
# WHAT CHANGED: two keys under a new `env:` on the suite step, and the step's name. Nothing else.
#
# THE STEP'S NAME IS PART OF THE FIX, not tidiness. It read "Regression suite (no credentials)",
# which after this edit would be false in the log of every run on dev and main — and a step whose
# name misreports its own environment is the same defect as the header sentence, one line further
# down. NAMED CAVEAT rather than hidden: on a pull_request from a FORK, GitHub resolves both
# secrets to the empty string by design (that is the safe behaviour and this file must not try to
# defeat it), so on that one path the name over-promises. The run itself still reports the truth —
# the credentialed halves declare themselves not-run, loudly and countably, exactly as they did
# before this ship — so the log is self-correcting where the name cannot be.
#
# THE EDIT THIS SHIP FORBIDS, in addition to the two the v7.0.286 header already forbids and which
# remain in force: reaching for `continue-on-error` when a credentialed half now FAILS. Those halves
# have never once run in CI, so the first credentialed run is the first time they are graded here,
# and a genuine failure is the single most valuable thing this ticket can produce. A red run means
# the platform is broken, not that the gate is. Fix the finding.
#
# HOW THIS IS TESTED, and it is deliberately not a claim made from the diff: the CI run on the
# commit that carries this edit IS the test. The pass is the regression step showing FEWER declared
# not-run parts than the 23 the v7.0.286 header measured with no credentials at all, and green.
# A run that still reports 23 means the secrets did not reach the step and this edit did nothing.
# Guarded by tests/regression/SES-180d-ci-credentialed-regression.js, which reads the shipped
# workflow rather than restating it.
#
# DeepBench v7.0.286 | .github/workflows/ci.yml | SES-180 (c) — THE TWO REPORTING JOBS BECOME REAL
# GATES. Both halves of the "reporting only" caveat this file shipped with have now been paid for
# by other tickets, so the caveat was the only thing still making CI a rubber stamp.
#
# WHAT CHANGED, AND WHY EACH HALF CAN HONESTLY GATE NOW — measured in a clean clone at this ship,
# not reasoned about:
#
#   regression  The v7.0.219 header's reason for `continue-on-error` was exact and, at the time,
#               right: "measured 2026-08-24, the suite is 50/50 with credentials and 49/50 without
#               — CHI-31 fails with SUPABASE_URL/SUPABASE_SERVICE_KEY must be configured. A test
#               that CANNOT RUN is not a test that FAILED." SES-180 (b) (`v7.0.224`) closed exactly
#               that gap: `notRun(part, reason)` lets a test DECLARE a part it cannot verify here,
#               and `run-all.js` exits 1 iff something FAILED, never because a part was declared.
#               MEASURED THIS SHIP with no credentials in the environment at all:
#               **87/87 passed, exit 0, 23 parts declared not-run across 18 tests.** The number the
#               v7.0.219 header said it could not gate on has become a number it can.
#   tripwire    `scripts/check-session-docs.js` still always exits 0 in its bare form — that is its
#               contract everywhere it runs and this file must not change it. SES-199 (`v7.0.242`)
#               added the second invocation instead: `--gate` exits 1 on FLAG findings in the
#               truth-registry classes (checks 9/10/11) and 0 otherwise, and fails CLOSED when the
#               registry cannot be read at all. Its own header names wiring that flag in here as
#               "the follow-up, not this". This is that follow-up. MEASURED THIS SHIP: `--gate`
#               reports "clear — no FLAG findings in the gating classes (checks 9/10/11). Exit 0",
#               over a report that still carries 38 FLAGs and 4 WARNs in the NON-gating classes —
#               which is the point of a named gating set, and the proof this is not a green
#               achieved by looking at nothing.
#
# WHAT THIS STILL DOES NOT DO, and neither is the runner's to do (SES-180's own residue, unchanged):
#   * Repository secrets (SUPABASE_URL, SUPABASE_SERVICE_KEY). Only John can add them. Until he
#     does, the credentialed halves stay DECLARED not-run — visible in the log, counted as neither
#     pass nor fail. That is what makes this gate honest rather than vacuous.
#     [CORRECTED v7.0.304, SES-180 (d).] This bullet used to end: "and it is also why adding the
#     secrets later makes the gate stronger with no edit to this file." That was FALSE. A secret
#     reaches a step only through an `env:` block naming it, and this step had none — so John adding
#     both secrets (done and verified 2026-08-29) would have changed nothing at all. The sentence is
#     struck rather than deleted, because a header that quietly drops its own wrong claim teaches
#     the next reader nothing. The `env:` block that makes it true now lives on the suite step below.
#   * Branch protection. This workflow now makes a failing check turn the RUN red; "red = no merge,
#     regardless of author" is a repository setting, not a file. Only John can make it binding.
#
# THE TWO EDITS THIS SHIP FORBIDS, because each one silently restores the rubber stamp:
#   1. Putting `continue-on-error: true` back to quiet a red run. A red run here now means a test
#      FAILED or a rule statement has drifted from its registry row. Fix the finding, or fix the
#      snapshot — never the job.
#   2. Dropping `--gate` back to the bare `node scripts/check-session-docs.js`. The bare form always
#      exits 0 BY CONTRACT (SES-199's own header: "Default behaviour is UNCHANGED and must stay that
#      way — no flag, always exit 0"). A gating step running the non-gating invocation is a step
#      that can never fail, which is precisely the defect SES-199 was filed to close.
#
# `if: always()` ON THE REGRESSION STEP IS LOAD-BEARING, not tidiness. Steps stop at the first
# failure, so without it a red tripwire would hide the suite's result entirely and every push after
# a drift finding would report one problem while concealing however many others. Both checks run,
# both report, and either one failing fails the job.
#
# ONE RISK NAMED RATHER THAN HIDDEN: this job's `name:` changes from "(reporting only)" to
# "(blocking)", and GitHub matches required status checks by job NAME. `dev` — where every runner
# push lands — carries no protection at all (read live from the branches API at this ship:
# `protected: false`), so nothing about the push path can break. `main` IS protected, and whether
# its required-checks list names this job is not readable from here; if it does, John re-selects the
# new name in the branch settings. Said out loud because a silently renamed required check is the
# exact failure this file's headers exist to prevent.
#
# DeepBench v7.0.219 | .github/workflows/ci.yml | SES-180 (M2 Truth Infrastructure) — PARTIAL
#
# The first check on this repository that does not live on John's machine.
#
# WHY THIS EXISTS. Six of the platform's hard rules are enforced by PreToolUse/PostToolUse hooks
# in C:/Projects/.claude/ — outside this repo, not git-tracked, present on exactly one machine
# (CLAUDE.md says so in as many words: "the hooks are a backstop, not a replacement"). The
# regression suite runs only where credentials happen to exist. So a push from a cloud cycle, a
# fresh clone, or any other contributor is checked by nothing at all. This workflow is the floor.
#
#   BLOCKING   build      `npm ci && npm run build`. Needs no credentials. A src/api/lib change
#                         that fails the build can no longer reach dev unnoticed.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and fails if
      # package.json and package-lock.json have drifted, which is itself a check worth having.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  checks:
    name: Tripwire + regression (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # `--gate` (SES-199), never the bare form — see the header. Gates on FLAG findings in checks
      # 9/10/11 only, the truth-registry classes; the size and shape ratchets stay advisory and are
      # still printed above the gate line. Reads docs/governance/RULES-SNAPSHOT.md and
      # docs/backlog/BACKLOG-SNAPSHOT.md, both committed, so it needs no credentials here.
      - name: Session-docs tripwire (gate)
        run: node scripts/check-session-docs.js --gate

      # `if: always()` so a red tripwire cannot conceal the suite's result — see the header.
      #
      # SES-180 (d), v7.0.304: the `env:` block is the whole of this ticket. `secrets.*` resolves
      # ONLY where it is written — GitHub never auto-exposes a repository secret to a step — so
      # without these two lines the credentialed halves declare themselves not-run (SES-180 (b))
      # however correctly the secrets are configured. Do not remove them to "simplify" the step.
      #
      # On a pull_request from a fork both resolve to the empty string by GitHub's own design; the
      # halves then declare not-run exactly as they did before this ship, which is the correct and
      # safe degradation, not a failure. Named in the header rather than papered over here.
      - name: Regression suite (credentialed)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node tests/regression/run-all.js

  # SES-255, v7.0.339 — CI PUBLISHES ITS OWN GRADE, because nothing else can read it.
  #
  # runner-cycle.md step 4a requires an unattended cycle to read this run's conclusion and hand it
  # to scripts/rollback-on-red.js as `--jobs`; the engine holds no credential and fetches nothing,
  # by John's own SES-182 design. That read has now failed on three consecutive cycles for one
  # measured reason: the GitHub REST listing for a single run on dev returns ~71,000 characters
  # (71,371 then 71,575, measured live), which exceeds the agent tool-result cap and overflows into
  # the ~/.claude/.../tool-results/ path register B39 forbids an unattended cycle to touch. Raw
  # HTTPS to api.github.com is separately refused by the session proxy. There is no bounded
  # sha -> conclusion read on any surface a cycle has.
  #
  # So the direction is inverted: the grader publishes its own grade to a table the runner already
  # reads. NO NEW SECRET IS PROVISIONED — both keys below are the repository secrets SES-180 (d)
  # already exposes to the step above, which is what keeps this out of the John-only lane this
  # file's header names (adding secrets; branch protection). The engine is untouched and the
  # conclusion is still PASSED IN.
  #
  # THE TWO GUARDS ARE LOAD-BEARING, not defensive habit:
  #
  #   `github.event_name == 'push'` — on a pull_request from a FORK both secrets resolve to the
  #   empty string by GitHub's design (the header says so for the step above), so without this the
  #   curl fails and paints an innocent contributor's PR red. It also stops same-repo PR runs
  #   writing rows for PR-branch shas that were never pushed to dev.
  #
  #   `always()` — a run whose `checks` job FAILED is the case the anchor most needs recorded, and
  #   the default `success()` would skip exactly it.
  #
  # WHAT THIS JOB CANNOT DO, stated rather than left to be found: it cannot report its own failure.
  # If it dies, no row is written, the anchor goes STALE, and a later red is measured against an
  # older commit or none — which is scripts/rollback-on-red.js's own stated fail direction (stale,
  # never wrong). Same for a cancelled run: `cancel-in-progress` kills this job too. A row whose
  # conclusions are neither all-success nor any-failure is COULD-NOT-TELL on the reading side and
  # triggers nothing; that rule lives in step 4a, because a `cancelled` handed in as a red would
  # let decide() revert on a superseded run.
  #
  # `needs` must name EVERY other job in this file. tests/regression/SES-255-ci-conclusion-reporting.js
  # computes that set from the shipped YAML rather than hardcoding it, so adding a fourth job
  # without adding it here fails the suite.
  report-conclusion:
    name: Report conclusions to the runner ledger
    needs: [build, checks]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publish blocking-job conclusions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BUILD_RESULT: ${{ needs.build.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "No Supabase credentials in this context -- nothing published."
            echo "The anchor stays stale, which is the safe direction. Not a failure."
            exit 0
          fi
          # jq composes the body so a job name containing a quote cannot break the JSON.
          jq -n \
            --arg sha "${GITHUB_SHA}" \
            --argjson run_id "${GITHUB_RUN_ID}" \
            --arg build "${BUILD_RESULT}" \
            --arg checks "${CHECKS_RESULT}" \
            '{commit_sha: $sha, run_id: $run_id, jobs: [
               {name: "Build (blocking)", conclusion: $build},
               {name: "Tripwire + regression (blocking)", conclusion: $checks}
             ]}' > /tmp/ci-conclusion.json
          cat /tmp/ci-conclusion.json
          curl --fail --silent --show-error \
            -X POST "${SUPABASE_URL}/rest/v1/ci_run_conclusions?on_conflict=commit_sha" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            --data @/tmp/ci-conclusion.json
