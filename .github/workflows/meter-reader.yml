# DeepBench | .github/workflows/meter-reader.yml | SES-388 -- the pace gate's sensor runs where nothing sleeps.
#
# WHY. The weekly pace gate (M5-16, SES-368) and the stale-meter refusal (SES-389) read the freshest
# public.runner_usage_readings row. Until 2026-09-14 the only writer was a scheduled task on John's
# machine (SES-374), so a sleeping laptop meant a sleeping runner: three fires refused meter_stale on
# the night of 2026-09-13. A cloud routine cannot be the reader either (measured 2026-09-13, probe run
# cse_01XgcrXWKfp2qZ4BokzfrL22: the cloud harness signs in with a session token, not the subscription).
#
# WHY THERE IS NO CLI HERE, MEASURED RATHER THAN ASSUMED. The first shape of this workflow installed the
# Claude Code CLI and ran `claude -p "/usage"` under a `claude setup-token` token. That token signs in
# (`claude auth status` -> oauth_token) but it does not carry the scope the meter needs: on runner
# 34864955276, /api/oauth/usage answered 403 oauth_scope_insufficient (needs user:profile) and /usage
# printed the session cost summary instead of the three meter lines. So the CLI is not installed at all.
#
# WHAT RUNS INSTEAD. `node scripts/read-usage-meter.js --via-headers` takes the same three numbers off
# the RATE-LIMIT HEADERS of two one-token POSTs to /v1/messages under the same token -- measured on runs
# 34864955276 and 34865128090: anthropic-ratelimit-unified-5h-utilization and -7d-utilization (plus both
# -reset epochs) on claude-haiku-4-5-20251001, and -7d_oi-utilization (the Fable week) on
# claude-fable-5-1. Two output tokens per reading, no prompt content, no logAICall (this is a script,
# not an api/ route). The row is written with the Supabase secrets CI already holds; its source is
# 'meter-reader-headers' and its note carries this runner's hostname, which is how a GitHub row is told
# from a row from John's machine. Both writers may run; the gate reads the newest row whatever wrote it.
#
# FAILURE IS VISIBLE. The script exits 2 when the token is missing or expired ('no-token' /
# 'headers-refused' -- mint a new one with `claude setup-token` and replace the secret), when a header
# the parser needs is gone ('parse', naming it -- tests/regression/ses-374-meter-reader.test.mjs pins
# the 2026-09-14 header shape), or when the insert is refused. A non-zero exit fails this job and GitHub
# emails the failure; that is SES-392's visible failure for this host. A reading older than 2h while
# this workflow is enabled means it is failing: read the Actions tab first.
name: meter-reader

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meter-reader
  cancel-in-progress: false

jobs:
  read:
    name: Read the usage meter
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # ref: dev -- this file must live on main (GitHub schedules only from the default branch), but the
      # script lives on dev; main sits at v7.0.90 and does not carry it. Found live on the first run.
      - uses: actions/checkout@v4
        with:
          ref: dev
          sparse-checkout: scripts/read-usage-meter.js
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read the meter from rate-limit headers and write one runner_usage_readings row
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/read-usage-meter.js --via-headers
