<style id="s">
  :root{

    --display:"Fraunces",Georgia,serif; --body:"Inter",-apple-system,system-ui,sans-serif;
    --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);margin:0;
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px 48px}
  header{background:var(--navy);color:var(--card);border-bottom:3px solid var(--brass);
         padding:14px;display:flex;align-items:center;gap:11px}
  .db{width:34px;height:34px;border-radius:50%;background:var(--brass);color:var(--navy);
      display:flex;align-items:center;justify-content:center;font-family:var(--display);
      font-weight:700;font-size:14px;border:2px solid var(--card);flex-shrink:0}
  header h1{font-family:var(--display);font-size:17px;font-weight:600;margin:0;line-height:1.1}
  header .sub{font-family:var(--mono);font-size:9px;color:var(--navy-text-hi);
              letter-spacing:1.2px;text-transform:uppercase;margin-top:2px}
  header .date{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--brass-light);
               text-align:right;line-height:1.3}
  header .date b{display:block;color:var(--card);font-weight:700}
  /* v7.0.172, directive 603f44ea — the last-action stamp, under the decisions counter. Two
     lines, and the third only when it is true: his newest tap, this page's rebuild, and the
     "not picked up yet" line that answers the half of his sentence a bare timestamp cannot. */
  header .date .la{display:block;margin-top:3px;font-size:10px;line-height:1.35}

  h2 .secnum{font-family:var(--mono);font-size:11px;color:var(--brass-deep);margin-right:7px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:7px;
        padding:14px 14px 12px;margin-bottom:14px}

  /* ---- SES-124 · THE COLLAPSE FRAMEWORK -------------------------------------------------
     The shared mechanism §§5/6/9/10/12 are built on (SES-125/126/127). Two shapes:
       (a) ONE CARD folds — <div class="item fold" id="X"> with a <div class="head" data-toggle="X">
           and a <div class="bodyc">. Closed by default; `.open` on the .item reveals the body.
       (b) A WHOLE SECTION folds — <h2 class="clickable" data-toggle="Y"> over a
           <div class="secwrap" id="Y">. Same `.open` switch, same chevron.
     `fold` is deliberately a MODIFIER rather than a restyle of `.item`: the always-open cards
     still on this page (converted by SES-125) keep their padding untouched, so this ticket can
     ship the framework without touching a single card. The mock's cards are shape (a) with
     `fold` added — that one word is the only difference from docs/design/briefing-redesign-mock-0822.html. */
  .item.fold{padding:0;overflow:hidden}
  .item.fold .head{display:flex;align-items:center;gap:8px;padding:11px 13px;cursor:pointer}
  .item.fold .head:hover{background:var(--card-alt)}
  .cardnum{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brass-deep);
           min-width:20px}
  .head .ttl{font-family:var(--display);font-size:14.5px;font-weight:600;line-height:1.25;flex:1}
  .idchip{font-family:var(--mono);font-size:10px;color:var(--brass-deep);flex:0 1 auto;
        min-width:0;max-width:35%;overflow-wrap:anywhere}
  .head .st{font-family:var(--mono);font-size:10px;color:var(--muted);flex-shrink:0}
  .head .st.done{color:var(--moss);font-weight:700}
  .chev{font-family:var(--mono);font-size:11px;color:var(--muted);flex-shrink:0}
  .bodyc{display:none;padding:2px 13px 13px;border-top:1px solid var(--line-soft)}
  .item.open .bodyc,.q.open .bodyc{display:block}
  h2.clickable{cursor:pointer}
  h2.clickable:hover{color:var(--ink)}
  h2 .chev{float:right;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .countchip{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--navy);
       color:var(--white);border-radius:9px;padding:1px 8px;vertical-align:1px}
  .secwrap{display:none}
  .secwrap.open{display:block}
  /* ---- SES-125 · THE DECISION CARDS -----------------------------------------------------
     §§5/6/9/12 now USE the framework above. `.q` gains the same `fold` modifier `.item` got,
     for the same reason: it is a modifier, so nothing that has not been converted moves.
     `.q.fold .head` aligns to flex-start rather than center — a question's text is a sentence

  .q.fold{padding:0;overflow:hidden}
  .q.fold .head{display:flex;align-items:flex-start;gap:8px;padding:11px 13px;cursor:pointer}
  .q.fold .head:hover{background:var(--card-alt)}

  .plain p{margin:0 0 8px;font-size:14px}

  .clschip{font-family:var(--mono);font-size:9.5px;color:var(--white);background:var(--navy);

        background:var(--card-alt)}

  .kind.test{color:var(--brass-deep);border-color:var(--brass-light)}
  .kind.gate{color:var(--brass-deep);border-color:var(--brass-light)}
  .item .top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .item .id{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
  .item h3{font-family:var(--display);font-size:17px;font-weight:600;margin:0 0 8px;text-wrap:balance}
  .item p{margin:0 0 8px;font-size:14px}
  .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;

  /* ---- SES-126 · THE BOARD TABLES (§§8/11/13/14) ----------------------------------------

  function fold(id, num, title, bodyHtml, headExtra){
    return '<div class="item fold" id="'+id+'">'
      +'<div class="head" data-toggle="'+id+'"><span class="cardnum">'+num+'</span>'
      +(headExtra||'')
      +'<span class="ttl">'+title+'</span><span class="chev">&#9656;</span></div>'
      +'<div class="bodyc">'+bodyHtml+'</div></div>';
  }

  // SES-132 — §9.1 · ANSWERED, YOUR PAST QUESTIONS. John, briefing page 2026-08-23T00:37Z:
  // "I could swear i have wrote comments in the gated questions, and most are not showing.
  // shouldn't the thread show each page refresh and what your answers are?" He was right, and
  // the cause is that the very act of deciding removes the only thing that could render his
  // line: §§5/6 rebuild from runner_items WHERE decision IS NULL, §9 from runner_questions
  // WHERE status='open' capped at 5, and §12 drops a decided claim. His comment and the
  // runner's reply then sit in runner_card_asks displayed nowhere.
  //
  // THE ORDERING TRAP, and it is why this is a marker rather than a call in place. §9.1 sits
  // between §9 and §10, but §12's vision claims render AFTER it — so an orphan set computed at
  // §9.1's own position would classify every vision-claim thread as orphaned and print it twice.
  // The section therefore emits a marker where it belongs and render() substitutes the real
  // block once the whole page has been built. The substitution passes a FUNCTION, never the
  // string: `$&` and friends are special in a String.replace replacement, and thread text is
  // John's prose, which may contain them.
  //
  // Rows carry NO `data-awaits`: a kept thread is information, not a decision owed, and
  // inflating §1's counter with it is the masthead-disagrees-with-the-page failure countWaiting()
  // exists to prevent — the same call SES-127 made for §10.
  var ORPHAN_MARK = '<!--SES132-ORPHAN-SLOT-->';
  function orphanThreads(){
    var ids = Object.keys(state.asks).filter(function(id){
      return !threadedIds[id] && (state.asks[id] || []).length;
    });
    if (!ids.length) return '';
    var rows = '';
    for (var i=0; i<ids.length; i++){
      rows += fold('past-'+ids[i], '9.1.'+(i+1), esc(ids[i]),
        '<p class="qctx">You decided this one, so the card or row it was attached to stopped '
        +'being rebuilt. Your line and my answer are kept here.</p>'
        + thread(ids[i]));
    }
    return '<h2 class="clickable" data-toggle="pastasks"><span class="secnum">9.1</span>'
      +'Answered &mdash; your past questions <span class="countchip">'+ids.length+'</span> '
      +'<span class="chev">&#9656;</span></h2>'
      +'<div class="secwrap" id="pastasks">'
      +'<p class="strip-def">Every question you have typed on this page, kept after the card or '
      +'row it was attached to was decided and stopped being rebuilt. Nothing here needs a '
      +'decision — it is your record, not a list of work.</p>'
      + rows
      +'</div>';
  }

  // SES-128 — §4's reading slots. ONE function renders both rows, for the same reason §9 and §12
  // are one function (SES-125): two near-copies of a form drift, and a Morning row that has
  // quietly stopped matching the Night row is a calibration bug nobody can see on the page.
  // `slot` is both the state key and the input-id prefix, so the page and the ledger cannot
  // disagree about which reading is which — the same rule that made `qid` the DOM id in §9.
  function readingSlot(slot, label, means){
    var r = state.reading[slot] || {};
    return '<div class="readslot"><div class="slotlbl">'+label+'</div>'
      +'<div class="readgrid">'
      +'<label>Fable %<input type="number" inputmode="numeric" id="r-'+slot+'-fable" value="'+esc(r.fable)+'"></label>'
      +'<label>All models %<input type="number" inputmode="numeric" id="r-'+slot+'-all" value="'+esc(r.all)+'"></label>'
      +'<label>5-hour %<input type="number" inputmode="numeric" id="r-'+slot+'-h5" value="'+esc(r.h5)+'"></label>'
      +'</div>'
      +'<div class="slotmeans">'+means+'</div>'
      +'<button class="savebtn" id="r-save-'+slot+'">Save '+slot+' reading</button>'
      +(r.at ? '<div class="recorded">&#10003; Recorded '+esc(r.at)+'</div>' : '')
      +'</div>';
  }

  // The card-level acknowledgement: the MOST RECENT reading across every slot, whichever that
  // is. It reads the slots rather than a stored "latest", because a stored latest is a second
  // copy of the same fact and the two go out of step the first time a cycle forgets to update it.
  function readingRecordedLine(){
    var best = null, bestSlot = '';
    ['night','morning','adhoc'].forEach(function(s){
      var r = state.reading[s];
      if (r && r.at && (!best || r.at > best.at)) { best = r; bestSlot = s; }
    });
    if (!best) return 'No reading yet — the runner is on its conservative allowance until your first one.';
    return '&#10003; Your latest reading was recorded — <b>'+esc(best.at)+'</b> ('+esc(bestSlot)
      +'): Fable <b>'+esc(best.fable)+'%</b> &middot; All models <b>'+esc(best.all)
      +'%</b> &middot; 5-hour <b>'+esc(best.h5)+'%</b>.';
  }

  // SES-125 — ONE DECISION CARD, §§5 and 6. Default CLOSED, numbered, and the collapsed row
  // carries everything John needs to decide whether to open it: number · kind · TICKET ID ·
  // ticket title · decision state. Arguments, in order:
  //   num      '5.1'                    — the section-relative card number shown in the head
  //   id       'item-LOG-128'           — DOM id AND the runner_items key the harvest writes on
  //   kindCls  'ship' | 'gate' | 'test' — drives the chip colour and the button meanings
  //   kindTxt  'Ship' | 'Gated'         — the chip's word
  //   tid      'LOG-128'                — the ID chip, visible while collapsed (John's rule)
  //   idLine   'LOG-128 (Log · P05 - Enhancements) · behind flag, currently OFF'
  //   title    the board's ticket title — not a re-worded headline
  //   techHtml Value case / Before → after / QA evidence / meta / links, i.e. the record
  //   more     {cant, after, worth, buttons:{…}} read from runner_items.plain_*
  function card(num, id, kindCls, kindTxt, tid, idLine, title, techHtml, more){
    var d = state.items[id] || {};
    var dec = d.decision || '';
    var showReason = dec==='reverse' || dec==='rework';
    // SES-124 — `data-awaits` is how the masthead counter (§1) knows this card still needs John.
    // It is set from STATE, not from the DOM's appearance, so a card that renders collapsed
    // still counts correctly. Every decidable element carries it; nothing else does.
    return '<div class="item fold" id="'+id+'"'+(dec?' data-decision="'+dec+'"':' data-awaits="1"')+'>'
      +'<div class="head" data-toggle="'+id+'"><span class="cardnum">'+num+'</span>'
      +'<span class="kind '+kindCls+'">'+kindTxt+'</span>'
      +'<span class="idchip">'+tid+'</span>'
      +'<span class="ttl">'+title+'</span>'
      +'<span class="st'+(dec?' done':'')+'">'+(dec?(dec.toUpperCase()+' ✓'):'undecided')+'</span>'
      +'<span class="chev">&#9656;</span></div>'
      +'<div class="bodyc">'
      +'<div class="idline">'+idLine+(dec&&d.at?(' &middot; decided '+esc(d.at)):'')+'</div>'
      +plainBlock(more)
      +techPanel(id, techHtml)
      +'<div class="decide">'
      +'<button class="accept'+(dec==='accept'?' on':'')+'" data-c="accept">Accept</button>'
      +'<button class="reverse'+(dec==='reverse'?' on':'')+'" data-c="reverse">Reverse</button>'
      +'<button class="rework'+(dec==='rework'?' on':'')+'" data-c="rework">Rework</button>'
      +'</div>'
      +decideMeans(kindCls, more && more.buttons)
      +'<div class="reason'+(showReason?' show':'')+'">'
      +'<input type="text" value="'+esc(d.reason)+'" placeholder="One line — then press Save">'
      +'<div class="hint">Press Enter or tap Save to record the line.</div></div>'
      +'<div class="verdict">'+(dec?('recorded: '+dec.toUpperCase()+' · '+esc(d.at||'')):'')+'</div>'
      +thread(id)
      +askBox(id, 'Ask or tell me anything about this — then press Enter',
              'Counts the same as the buttons — your line is recorded now and answered on this card next cycle.',
              'answer appears on this card next cycle')
      +'</div></div>';
  }

  // SES-99 — one open row of public.runner_questions. `qid` is the table's stable slug and is
  // the key the harvest writes back on, so it is the DOM id too: the page and the ledger cannot
  // drift apart. Two buttons, no text box in the way — the note is optional and appears only
  // after an answer exists to attach it to.
  // v7.0.145, directive edab5908 — John: "Your yes/no did not clarify that statement … Perhaps
  // make a statement next to the button, so it clarifies it." `yesMeans`/`noMeans` are the
  // consequence of each tap in one line, rendered directly beneath the button that causes it, so
  // the question never has to be re-parsed to work out which way round it runs. They are
  // REQUIRED: a question row without them renders the defect in red rather than two bare buttons.
  // SES-125 — folded, numbered, and the ask box is out of the More-info panel: a question row
  // has no technical record to hide, so the panel it used to carry existed only to hold the ask
  // box, and John had to open a button to answer in his own words. The box is now under the
  // buttons, where the Yes/No is. `opts` is how §12 reuses this row verbatim rather than
  // growing a near-copy — the spec's word is "formatted exactly like Questions", so §9 and §12
  // are one function, not two that must be kept in step:
  //   opts.chip            markup shown before the text in the head (§12's class chip)
  //   opts.ask{ph,hint,got} the ask box's three strings, which differ in meaning for a claim
  function question(num, qid, text, ctx, yesMeans, noMeans, opts){
    var a = state.answers[qid] || {};
    var ans = a.a || '';
    opts = opts || {};
    var ask = opts.ask || { ph:'Ask or answer in your own words — then press Enter',
                            hint:'Counts the same as the buttons — recorded now, answered here next cycle.',
                            got:'answer appears here next cycle' };
    var means = (yesMeans && noMeans)
      ? '<div class="ynmean"><span>Yes &rarr; '+yesMeans+'</span><span>No &rarr; '+noMeans+'</span></div>'
      : '<div class="ynmean"><span class="missing">This question was published without its '
        +'Yes/No consequences — a defect in the cycle that asked it. Ask me what it means in the '
        +'box below rather than guessing.</span></div>';
    return '<div class="q fold" id="'+qid+'"'+(ans?' data-answer="'+ans+'"':' data-awaits="1"')+'>'
      +'<div class="head" data-toggle="'+qid+'"><span class="cardnum">'+num+'</span>'
      +(opts.chip||'')
      +'<span class="qtext">'+text+'</span>'
      +'<span class="st'+(ans?' done':'')+'">'+(ans?(ans.toUpperCase()+' ✓'):(opts.undecidedTxt||'unanswered'))+'</span>'
      +'<span class="chev">&#9656;</span></div>'
      +'<div class="bodyc">'
      +(ctx ? '<p class="qctx">'+ctx+'</p>' : '')
      +'<div class="yn">'
      +'<button class="yes'+(ans==='yes'?' on':'')+'" data-a="yes">Yes</button>'
      +'<button class="no'+(ans==='no'?' on':'')+'" data-a="no">No</button>'
      +'</div>'
      +means
      +'<div class="qnote'+(ans?' show':'')+'">'
      +'<input type="text" value="'+esc(a.note)+'" placeholder="Optional — a line only if you want to add one">'
      +'<div class="hint">Not required. The Yes/No above is already recorded.</div></div>'
      +'<div class="qverdict">'+(ans?('recorded: '+ans.toUpperCase()+' · '+esc(a.at||'')):'')+'</div>'
      +thread(qid)
      +askBox(qid, ask.ph, ask.hint, ask.got)
      +'</div></div>';
  }

  // §12 · A VISION CLAIM (SES-125). Spec: "formatted exactly like Questions" — so it IS a
  // question row, with a class chip in front and the three ask-box strings that fit a claim
  // (John's own wording REPLACES the claim rather than asking about it, which is a different
  // transaction from asking a question and has to say so). Always three rows, always default
  // closed, and a claim reappears every day until it is decided — only silence carries it
  // forward, exactly as silence never decides anything else on this page.
  // `vid` MUST be the `vision-<doc>-<claim id>` form: the harvest reads answers by key, and
  // this is what tells it a row belongs to docs/vision/*.md rather than runner_questions.
  function visionClaim(num, vid, cls, text, ctx, yesMeans, noMeans){
    return question(num, vid, text, ctx, yesMeans, noMeans, {
      chip: '<span class="clschip">'+cls+'</span>',
      undecidedTxt: 'undecided',
      ask: { ph:'Or say it in your own words — then press Enter',
             hint:'Your line replaces the claim, marked as your words — that also resolves it.',
             got:'the claim is rewritten in your words' }
    });
  }

  // SES-126 — the three board-table row helpers (§§8, 11/13, 14). They exist for the same
  // reason `card()` and `question()` do: a table whose rows are hand-written strings drifts a
  // cell at a time, and these are the rows a cycle regenerates on EVERY rebuild. Each escapes
  // its own text — §8 titles and §14 names are ticket prose and visitor labels, i.e. the two
  // places on this page where the content is not written by a cycle.
  function queueRow(q, id, epic, cls, status, design, title){
    return '<tr><td class="num">'+q+'</td><td class="mono">'+esc(id)+'</td>'
      +'<td class="dim">'+esc(epic)+'</td>'
      +'<td class="mono dim">'+esc(cls)+'</td><td class="dim">'+esc(status)+'</td>'
      +'<td class="dim">'+esc(design)+'</td><td class="ttl2">'+title+'</td></tr>';
  }
  function classRow(cid, name, n){
    return '<tr><td><span class="mono dim">'+cid+'</span> &nbsp;'+name+'</td>'
      +'<td class="num">'+n+'</td></tr>';
  }
  function ladderRow(cid, work, rung, streak){
    return '<tr><td class="mono dim">'+cid+'</td><td>'+work+'</td>'
      +'<td class="num">'+rung+'</td><td class="num">'+streak+'</td></tr>';
  }
  // SES-129 — ONE §7 ROW: what became of one directive, in plain words.
  //   id8      the directive's short id — John's handle on it, and what the ledger calls it
  //   when    'Mon DD, HH12:MI AM' CST, the time the RUNNER RECORDED it (see the render below —
  //            it is deliberately not called "saved")
  //   line     John's own words, first line of `body`, truncated
  //   st       the plain-words state string, composed by stateOf() below — never typed per row.
  //            stateOf() returns NULL for the one state it refuses to describe: a `done` directive
  //            with no stored outcome, which close_directive() makes impossible and which
  //            therefore means the function was bypassed. THE DEFECT IS DERIVED FROM THAT NULL,
  //            never passed as a second argument — two copies of one fact drift, and the copy
  //            that would drift here is the one that decides whether John sees a problem at all.
  //            It draws the red line for the same reason a NULL plain_* does (v7.0.145/146): a
  //            missing verdict must LOOK missing, never look fine.
  // No `data-awaits` on any row: this card reports what already happened. Nothing here is a
  // decision John owes, and inflating §1's counter with it is the masthead-disagrees-with-the-page
  // failure SES-124 built countWaiting() to prevent (same call SES-127 made for §10).
  function dirRow(id8, when, line, st){
    var defect = (st == null);
    return '<tr><td class="mono dim">'+esc(id8)+'</td><td class="dim">'+esc(when)+'</td>'
      +'<td class="ttl2">'+esc(line)+'</td>'
      +'<td'+(defect?' class="missing"':'')+'>'+(defect
        ? 'closed with no outcome recorded &mdash; close_directive() was bypassed'
        : st)+'</td></tr>';
  }
  // THE OUTCOME VOCABULARY, IN ONE PLACE. Composed here rather than per row so three rows cannot
  // describe the same state three ways — the §9/§12 one-function rule (SES-125) applied to prose.
  // STORED vs DERIVED is the whole design and must be preserved by anyone editing this:
  // a CONSUMED directive's verdict is READ from runner_directives.outcome/.outcome_note (it exists
  // nowhere else — see the migration header on why runner_cycles.item_id cannot supply it), while
  // every LIVE state below is DERIVED from type+status+expires_at, which are already columns and
  // cannot go stale. The one that matters is `standing`: SES-111 property (2) says a drain-epic is
  // NEVER consumed, so it sits at status='queued' forever BY DESIGN — rendering it as "waiting to
  // be picked up" would tell John the opposite of the truth about the directive currently serving
  // him. Do not add a stored value for it.
  function stateOf(type, status, outcome, note, acted8, expires, overrideLive){
    if (status === 'done') {
      if (outcome === 'shipped')     return 'shipped &mdash; '+esc(note)+' <span class="dim mono">('+esc(acted8)+')</span>';
      if (outcome === 'carded')      return 'carded as a question &mdash; '+esc(note);
      if (outcome === 'superseded')  return 'superseded &mdash; '+esc(note);
      if (outcome === 'closed_unrecorded')
        return '<span class="dim">closed before this card existed &mdash; outcome not recorded</span>';
      return null;   // caller draws the defect line
    }
    if (status === 'in_progress') return 'in progress <span class="dim mono">('+esc(acted8)+')</span>';
    if (status === 'expired')     return '<span class="dim">expired</span>';
    if (status === 'cancelled')   return '<span class="dim">cancelled</span>';
    if (type === 'drain-epic')    return 'standing &mdash; worked every cycle until the epic&rsquo;s now bucket is empty';
    if (type === 'budget_override')
      return overrideLive ? 'active until <b>'+esc(expires)+'</b>'
                          : '<span class="dim">expired '+esc(expires)+'</span>';
    return 'waiting &mdash; the next cycle picks it up first';
  }
  // SES-127 — ONE §10 ROW. Nine columns, Unblock first (the spec's order: the action comes
  // before the identifiers, because the section exists to be acted on, not read).
  //   sid    the runner_skips row id — the key `state.unblocks` is written under, so a tap
  //          survives the republish and the harvest can find the row it belongs to
  //   unb    'question' | 'prep' | 'card' | null — which button this row gets
  //   ref    the card id a 'card' row points at (rendered as its short id, John taps the card
  //          itself in §5/§6 — the page deliberately does not try to scroll him there)
  //   isNew  briefed_at IS NULL, i.e. skipped since his last brief
  //   kick   SES-119 — the ticket's `kickoff_link`, passed ONLY for a needs-desktop row whose
  //          design_status is already 'designed'. SES-112's CHECK guarantees a 'designed' row has
  //          one, so this is never a guess. It renders as a second line in the reason cell because
  //          that is the cell that answers "why is this waiting on me", and for these rows the
  //          honest answer includes "and the design is already written" — the difference between
  //          sitting down to work it out and sitting down to paste it. Omit or pass '' otherwise;
  //          it is the LAST parameter so every existing 12-argument call site is unchanged.
  // A row carries NO `data-awaits`: a skipped ticket is information, not a decision John owes,
  // and inflating §1's counter with rows that need no tap is exactly the masthead-disagrees-with
  // -the-page failure SES-124 built countWaiting() to prevent.
  function skipRow(sid, id, cls, q, design, status, title, reason, when, unb, ref, isNew, kick){
    var taken = state.unblocks[sid];
    var label = unb==='question' ? 'Answer as a question'
              : unb==='prep'     ? 'Prep our session'
              : unb==='card'     ? 'Decide on card '+esc(String(ref||'').slice(0,8))
              : 'No action here yet';
    var btn = unb==='card'
      ? '<button class="unblock" disabled>'+label+'</button>'
      : '<button class="unblock'+(taken?' on':'')+'" data-skip="'+sid+'" data-unb="'+unb+'">'
        +(taken?'&#10003; Asked for':'')+' '+label+'</button>';
    return '<tr><td>'+btn+(isNew?' <span class="newchip">new</span>':'')+'</td>'
      +'<td class="mono">'+esc(id)+'</td><td class="mono dim">'+esc(cls)+'</td>'
      +'<td class="num">'+esc(q)+'</td><td class="dim">'+esc(design)+'</td>'
      +'<td class="dim">'+esc(status)+'</td><td class="ttl2">'+esc(title)+'</td>'
      +'<td class="reason">'+esc(reason)
        +(kick ? '<span class="kick">Kickoff ready &mdash; '+esc(kick)+'</span>' : '')
      +'</td><td class="mono dim">'+esc(when)+'</td></tr>';
  }
  function useRow(t, ip, loc, name, did, cost){
    return '<tr><td class="mono">'+esc(t)+'</td><td class="mono">'+esc(ip)+'</td>'
      +'<td class="dim">'+esc(loc)+'</td><td>'+esc(name)+'</td><td class="dim">'+esc(did)+'</td>'
      +'<td class="num">'+esc(cost)+'</td></tr>';
  }

  // SES-143 — §2b's effective values. John's un-harvested tap OUTRANKS the DB's value, exactly as
  // `state.items` outranks a rebuilt card: he flipped the switch, no cycle has picked it up yet,
  // and a checkbox that springs back to the old value on the next render reads as a tap that was
  // thrown away. `undefined` — not falsy — is the test, because `false` is a real answer here and
  // `scheduler_on:false` must not fall through to the DB's `true`.
  function settingsNow(){
    var s = state.settings || {};
    return {
      scheduler_on:   s.scheduler_on   === undefined ? !!AUTOMATION.scheduler_on : !!s.scheduler_on,
      interval_hours: s.interval_hours === undefined ? AUTOMATION.interval_hours  : s.interval_hours,
      drain_on:       s.drain_on       === undefined ? !!AUTOMATION.drain_on      : !!s.drain_on,
      drain_epic:     s.drain_epic     === undefined ? AUTOMATION.drain_epic      : s.drain_epic,
      at:             s.at || ''
    };
  }

  // §2b · AUTOMATION. Three rows, per the locked spec (docs/BRIEFING-REDESIGN-0822.md §2b):
  // scheduler, drain, status line.
  //
  // NO `data-awaits` ANYWHERE IN HERE, and that is deliberate. A switch is a control, not a
  // decision owed — the same call SES-127 made for §10 and SES-132 for §9.1. Counting it in §1's
  // "N decisions waiting" is the masthead-disagrees-with-the-page failure countWaiting() exists to
  // prevent, and it would never reach zero, because a checkbox is always there to be tapped.
  function automationPanel(){
    var s = settingsNow();
    var hist = (AUTOMATION.drain_history || []).map(function(h){
      return '<div class="autohist">&#10003; '+esc(h)+'</div>'; }).join('');
    // The drain's status label is ALWAYS shown (spec: "Status label underneath, always").
    var drainStat = s.drain_on
      ? '<b>'+esc(AUTOMATION.drain_left)+'</b> of <b>'+esc(AUTOMATION.drain_named)
        +'</b> tickets left in '+esc(AUTOMATION.drain_epic)
      : 'No drain running.';
    // Both off is the one combination that means nothing happens, so it is said in words rather
    // than left for John to infer from two unchecked boxes (spec, verbatim).
    var bothOff = (!s.scheduler_on && !s.drain_on)
      ? '<div class="slotmeans" style="color:var(--brass-deep)"><b>Both switches are off — '
        +'no runs will start at all until you turn one back on.</b></div>' : '';
    return '<h2><span class="secnum">2b</span>Automation &mdash; how this runs, and your switches</h2>'
      +'<div class="budget"><h4>Scheduler &amp; drain</h4>'
      // --- row 1 · scheduler ---------------------------------------------------------------
      +'<div class="autorow">'
      +'<input type="checkbox" id="sch-on"'+(s.scheduler_on?' checked':'')+'>'
      +'<div class="autobody"><label class="sw" for="sch-on">Scheduler <b>'
      +(s.scheduler_on?'on':'off')+'</b> &mdash; run a cycle every '
      +'<input class="numbox" id="sch-n" type="number" inputmode="numeric" min="1" max="24" value="'
      +esc(s.interval_hours)+'"> hours</label>'
      +'<div class="slotmeans">The schedule itself fires every hour and always will &mdash; the run '
      +'itself keeps to your number, and a run that arrives early stops straight away and says '
      +'&ldquo;paced by your scheduler setting&rdquo;. Unticking this stops every scheduled run. '
      +'A run you start yourself from the link below is never paced.</div>'
      +'</div></div>'
      // --- row 2 · drain ---------------------------------------------------------------------
      +'<div class="autorow">'
      +'<input type="checkbox" id="drn-on"'+(s.drain_on?' checked':'')+'>'
      +'<div class="autobody"><label class="sw" for="drn-on">Complete epic '
      +'<input class="txtbox" id="drn-epic" value="'+esc(s.drain_epic)+'"> until done.</label>'

    // publish reloads the view, which would slam the panel shut the instant it opened.
    document.querySelectorAll('.morebtn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var panel = document.getElementById('more-'+btn.getAttribute('data-more'));
        if (!panel) return;
        var nowOpen = !panel.classList.contains('show');
        panel.classList.toggle('show', nowOpen);
        btn.classList.toggle('on', nowOpen);
        // SES-125 — the panel is the technical record now, so the label says which record it is.
        btn.textContent = nowOpen ? 'Hide the technical record' : 'More info — the technical record';
      });
    });
    // An ask, on the other hand, IS recorded — same publish path as a tap. Append, never replace:
    // the thread is the log John asked to keep, so a second question is a second entry.
    document.querySelectorAll('.ask input').forEach(function(inp){
      var target = inp.getAttribute('data-ask');
      inp.addEventListener('keydown', function(e){
        if (e.key !== 'Enter') return;
        var q = inp.value.trim();
        if (!q) return;
        if (!state.asks[target]) { state.asks[target] = []; }
        state.asks[target].push({ q:q, at:new Date().toISOString().slice(0,16)+'Z' });
        inp.value = '';
        // SES-125 — acknowledge in place, before the publish round trip. render() will draw the
        // same line from state a moment later; this is what John sees the instant he hits Enter.
        var g = inp.parentElement.querySelector('.got');
        if (g) g.classList.add('show');
        save(); render();
      });
    });
    // SES-127 — §10's Unblock buttons. Recorded like a tap, not like a fold: it IS a decision
    // (it tells the next run to do something), so it publishes. Idempotent by construction —
    // tapping twice records the same intent once, because the harvest is keyed on the skip id
    // and the state entry is replaced rather than appended. A 'card' row's button is disabled:
    // its blocker is already a card in §5/§6 and a second way to decide the same thing is how
    // two half-decisions get made about one ticket.
    document.querySelectorAll('button.unblock[data-skip]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var sid = btn.getAttribute('data-skip');
        state.unblocks[sid] = { kind: btn.getAttribute('data-unb'),
                                at: new Date().toISOString().slice(0,16)+'Z' };
        save(); render();
      });
    });
    document.querySelectorAll('.item').forEach(function(cardEl){
      var id = cardEl.id;
      cardEl.querySelectorAll('.decide button').forEach(function(btn){
        btn.addEventListener('click', function(){
          var c = btn.getAttribute('data-c');
          var cur = state.items[id] || {};
          state.items[id] = { decision:c, reason:(c==='accept'?'':(cur.reason||'')),
                              at:new Date().toISOString().slice(0,16)+'Z' };
          if (c==='accept') { save(); render(); }
          else { render(); var inp=document.querySelector('#'+id+' .reason input'); if(inp) inp.focus(); }
        });
      });
      var inp = cardEl.querySelector('.reason input');
      if (inp) {
        function commit(){
          var cur = state.items[id];
          if (!cur || cur.reason === inp.value) return;
          cur.reason = inp.value; save();
        }
        inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ commit(); } });
        inp.addEventListener('blur', commit);
      }
    });
    // SES-99 — question rows. Same publish path as a card tap: the answer is recorded the
    // instant the thumb lands, and the note is a strictly optional afterthought.
    document.querySelectorAll('.q').forEach(function(qEl){
      var qid = qEl.id;
      qEl.querySelectorAll('.yn button').forEach(function(btn){
        btn.addEventListener('click', function(){
          var cur = state.answers[qid] || {};
          state.answers[qid] = { a:btn.getAttribute('data-a'), note:(cur.note||''),
                                 at:new Date().toISOString().slice(0,16)+'Z' };
          save(); render();
        });
      });
      var ni = qEl.querySelector('.qnote input');
      if (ni) {
        function commitNote(){
          var cur = state.answers[qid];
          if (!cur || cur.note === ni.value) return;
          cur.note = ni.value; save();
        }
        ni.addEventListener('keydown', function(e){ if(e.key==='Enter'){ commitNote(); } });
        ni.addEventListener('blur', commitNote);
      }
    });
    // SES-143 — §2b's four controls. Every one of them writes the WHOLE settings object, never a
    // single key, and that is the point: the harvest reads one row, and a state carrying
    // `{scheduler_on:false}` alone would leave the next cycle unable to tell "he turned the drain
    // off" from "he never touched the drain". settingsNow() has already resolved tap-over-DB, so
    // writing its output back is exactly what he is looking at.
    function saveSettings(patch){
      var s = settingsNow();
      Object.keys(patch).forEach(function(k){ s[k] = patch[k]; });
      s.at = new Date().toISOString().slice(0,16)+'Z';
      state.settings = s;
      save();
    }
    var schOn = document.getElementById('sch-on');
    // A checkbox re-renders (the label reads "on"/"off" and the both-off warning appears), which
    // the number and text boxes deliberately do NOT — re-rendering mid-typing would steal focus.
    if (schOn) schOn.addEventListener('change', function(){
      saveSettings({ scheduler_on: schOn.checked }); render();
    });
    var schN = document.getElementById('sch-n');
    if (schN) {
      var commitN = function(){
        var n = parseInt(schN.value, 10);
        // Out of range is not a setting — it is a typo, and storing it would hand the gate a
        // number its own CHECK rejects. Put the live value back and record nothing.
        if (!(n >= 1 && n <= 24)) { schN.value = settingsNow().interval_hours; return; }
        if (n === settingsNow().interval_hours) return;
        saveSettings({ interval_hours: n });
      };
      schN.addEventListener('keydown', function(e){ if (e.key === 'Enter') { commitN(); } });
      schN.addEventListener('blur', commitN);
    }
    var drnOn = document.getElementById('drn-on');
    if (drnOn) drnOn.addEventListener('change', function(){
      saveSettings({ drain_on: drnOn.checked }); render();
    });
    var drnEpic = document.getElementById('drn-epic');
    if (drnEpic) drnEpic.addEventListener('blur', function(){
      if (drnEpic.value === settingsNow().drain_epic) return;
      saveSettings({ drain_epic: drnEpic.value });
    });
    var ta = document.querySelector('.directive textarea');
    if (ta) ta.addEventListener('blur', function(){
      // v7.0.172, directive 603f44ea — stamp `directive_at` alongside the text. Typing a
      // directive is the action John is most likely to have taken last, and until now it was
      // the ONE action the page could not date: `directive` is a bare string where every other
      // tap carries an `at` (the gap SES-129 named on its card). Additive to briefing-state —
      // no harvest reads `directive` differently because a sibling key appeared next to it.
      if (state.directive !== ta.value) {
        state.directive = ta.value;
        state.directive_at = new Date().toISOString().slice(0,16)+'Z';
        save();
      }
    });
    // SES-128 — one handler per slot, wired from the same list the render used, so a slot can
    // never exist on the page without a handler behind it. Each slot writes only its own key:
    // saving a morning reading must never disturb the night reading it is measured against.
    ['night','morning'].forEach(function(slot){
      var rs = document.getElementById('r-save-'+slot);
      if (!rs) return;
      rs.addEventListener('click', function(){
        var f = document.getElementById('r-'+slot+'-fable').value,
            a = document.getElementById('r-'+slot+'-all').value,
            h = document.getElementById('r-'+slot+'-h5').value;
        if (!f && !a && !h) return;
        state.reading[slot] = { fable:f, all:a, h5:h,
                                at:new Date().toISOString().slice(0,16)+'Z' };
        save(); render();
      });
    });
  }

  render();
})();
</script>
