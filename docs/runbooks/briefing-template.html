<title>DeepBench Morning Briefing</title>
<link id="f" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style id="s">
  :root{
    --paper:#ebe5d5; --card:#f8f2e2; --card-alt:#f2ead4;
    --navy:#12243c; --ink:#28221a;
    --muted:#786d52; --muted-deep:#58503a; --line:#c8bb9a; --line-soft:#d8cbac;
    --brass:#b6873a; --brass-deep:#886224; --brass-light:#e4c786;
    --navy-text-hi:#b8c5d8; --moss:#5a7538; --moss-light:#a6bc82; --flag:#a83319; --white:#ffffff;
    --display:"Fraunces",Georgia,serif; --body:"Inter",-apple-system,system-ui,sans-serif;
    --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);margin:0;
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px 48px}
  header{background:var(--navy);color:var(--card);border-bottom:3px solid var(--brass);
         padding:14px;display:flex;align-items:center;gap:11px}
  .db{width:34px;height:34px;border-radius:50%;background:var(--brass);color:var(--navy);
      display:flex;align-items:center;justify-content:center;font-family:var(--display);
      font-weight:700;font-size:14px;border:2px solid var(--card);flex-shrink:0}
  header h1{font-family:var(--display);font-size:17px;font-weight:600;margin:0;line-height:1.1}
  header .sub{font-family:var(--mono);font-size:9px;color:var(--navy-text-hi);
              letter-spacing:1.2px;text-transform:uppercase;margin-top:2px}
  header .date{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--brass-light);
               text-align:right;line-height:1.3}
  header .date b{display:block;color:var(--card);font-weight:700}
  .stats{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);
         border-radius:6px;overflow:hidden;margin:12px 0 8px}
  .stat{flex:1;background:var(--card);padding:9px 6px;text-align:center}
  .stat b{display:block;font-family:var(--mono);font-size:15px;font-weight:700;
          font-variant-numeric:tabular-nums;color:var(--navy)}
  /* SES-124 — every number is labeled, and a label may wrap to two lines ("Tokens of 10M daily
     max"). letter-spacing drops from .8 to .6 and the label becomes a block so the wrap is even. */
  .stat span{font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);
             line-height:1.3;display:block;margin-top:2px}
  .strip-def{font-size:11.5px;color:var(--muted-deep);margin:0 0 4px;line-height:1.5}
  .strip-def b{color:var(--ink)}
  .finding p{margin:0 0 8px;font-size:14px}
  h2{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.4px;
     text-transform:uppercase;color:var(--muted-deep);margin:26px 0 10px;
     border-bottom:1px solid var(--line);padding-bottom:5px}
  h2 .secnum{font-family:var(--mono);font-size:11px;color:var(--brass-deep);margin-right:7px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:7px;
        padding:14px 14px 12px;margin-bottom:14px}
  .item[data-decision]{border-color:var(--brass)}
  /* ---- SES-124 · THE COLLAPSE FRAMEWORK -------------------------------------------------
     The shared mechanism §§5/6/9/10/12 are built on (SES-125/126/127). Two shapes:
       (a) ONE CARD folds — <div class="item fold" id="X"> with a <div class="head" data-toggle="X">
           and a <div class="bodyc">. Closed by default; `.open` on the .item reveals the body.
       (b) A WHOLE SECTION folds — <h2 class="clickable" data-toggle="Y"> over a
           <div class="secwrap" id="Y">. Same `.open` switch, same chevron.
     `fold` is deliberately a MODIFIER rather than a restyle of `.item`: the always-open cards
     still on this page (converted by SES-125) keep their padding untouched, so this ticket can
     ship the framework without touching a single card. The mock's cards are shape (a) with
     `fold` added — that one word is the only difference from docs/design/briefing-redesign-mock-0822.html. */
  .item.fold{padding:0;overflow:hidden}
  .item.fold .head{display:flex;align-items:center;gap:8px;padding:11px 13px;cursor:pointer}
  .item.fold .head:hover{background:var(--card-alt)}
  .cardnum{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brass-deep);
           min-width:20px}
  .head .ttl{font-family:var(--display);font-size:14.5px;font-weight:600;line-height:1.25;flex:1}
  .idchip{font-family:var(--mono);font-size:10px;color:var(--brass-deep);flex-shrink:0}
  .head .st{font-family:var(--mono);font-size:10px;color:var(--muted);flex-shrink:0}
  .head .st.done{color:var(--moss);font-weight:700}
  .chev{font-family:var(--mono);font-size:11px;color:var(--muted);flex-shrink:0}
  .bodyc{display:none;padding:2px 13px 13px;border-top:1px solid var(--line-soft)}
  .item.open .bodyc,.q.open .bodyc{display:block}
  h2.clickable{cursor:pointer}
  h2.clickable:hover{color:var(--ink)}
  h2 .chev{float:right;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .countchip{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--navy);
       color:var(--white);border-radius:9px;padding:1px 8px;vertical-align:1px}
  .secwrap{display:none}
  .secwrap.open{display:block}
  /* ---- SES-125 · THE DECISION CARDS -----------------------------------------------------
     §§5/6/9/12 now USE the framework above. `.q` gains the same `fold` modifier `.item` got,
     for the same reason: it is a modifier, so nothing that has not been converted moves.
     `.q.fold .head` aligns to flex-start rather than center — a question's text is a sentence
     and wraps to three lines on a phone, where a centered chevron drifts into the middle of it. */
  .q.fold{padding:0;overflow:hidden}
  .q.fold .head{display:flex;align-items:flex-start;gap:8px;padding:11px 13px;cursor:pointer}
  .q.fold .head:hover{background:var(--card-alt)}
  .q.fold .head .qtext{flex:1;margin:0;font-size:14px;line-height:1.35}
  .head .kind{flex-shrink:0}
  .idline{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:9px 0 8px}
  .plain p{margin:0 0 8px;font-size:14px}
  /* The judgment class a vision claim sets criteria for (§12). Navy on white, so it reads as a
     label rather than competing with the brass card number beside it. */
  .clschip{font-family:var(--mono);font-size:9.5px;color:var(--white);background:var(--navy);
       border-radius:3px;padding:1px 6px;flex-shrink:0}
  .tblwrap{overflow-x:auto;border-radius:7px}
  .kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;
        padding:2px 7px;border-radius:3px;border:1px solid var(--line);color:var(--muted-deep);
        background:var(--card-alt)}
  .kind.ship{color:var(--moss);border-color:var(--moss-light)}
  .kind.test{color:var(--brass-deep);border-color:var(--brass-light)}
  .kind.gate{color:var(--brass-deep);border-color:var(--brass-light)}
  .item .top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .item .id{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
  .item h3{font-family:var(--display);font-size:17px;font-weight:600;margin:0 0 8px;text-wrap:balance}
  .item p{margin:0 0 8px;font-size:14px}
  .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;
       color:var(--brass-deep);display:block;margin-bottom:1px}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:11px;
        color:var(--muted-deep);margin:10px 0;font-variant-numeric:tabular-nums}
  .links a{color:var(--brass-deep);font-weight:600;font-size:13px;text-decoration:underline;
           text-underline-offset:2px;margin-right:14px}
  .decide{display:flex;gap:8px;margin-top:12px}
  .decide button{flex:1;font-family:var(--body);font-weight:600;font-size:13.5px;
                 padding:10px 4px;border-radius:6px;border:1.5px solid var(--line);
                 background:var(--card-alt);color:var(--ink);cursor:pointer;min-height:44px}
  .decide button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  button.accept.on{background:var(--moss);border-color:var(--moss);color:var(--white)}
  button.reverse.on{background:var(--flag);border-color:var(--flag);color:var(--white)}
  button.rework.on{background:var(--brass);border-color:var(--brass-deep);color:var(--white)}
  .verdict{font-family:var(--mono);font-size:11px;color:var(--moss);margin-top:8px;min-height:15px}
  .reason{display:none;margin-top:9px}
  .reason.show{display:block}
  .reason input{width:100%;font-family:var(--body);font-size:14px;padding:9px 10px;
                border:1.5px solid var(--brass);border-radius:6px;background:var(--white);color:var(--ink)}
  .reason input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
  .reason .hint{font-size:10.5px;color:var(--muted);margin-top:3px}
  .empty{font-size:13.5px;color:var(--muted);font-style:italic;padding:4px 2px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);
        border-radius:7px;overflow:hidden;font-size:12.5px}
  th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line-soft)}
  th{font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;
     color:var(--muted);background:var(--card-alt)}
  td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  /* ---- SES-126 · THE BOARD TABLES (§§8/11/13/14) ----------------------------------------
     §8 and §14 are six-column matrices and this page is read on a phone every morning, where
     six columns of text either squeeze to one character per line or push the whole page
     sideways. `.tscroll` gives the WIDE tables their own horizontal scroll so the body never
     scrolls sideways; `.mono`/`.dim` are the two cell treatments those tables need. §11 and
     §13 are narrow and deliberately do NOT get the wrapper — a scroll affordance on a table
     that fits reads as a table that is cut off. */
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:7px}
  .tscroll table{min-width:560px}
  td.mono{font-family:var(--mono);font-size:11px}
  td.dim{color:var(--muted)}
  td.ttl2{font-family:var(--display);font-size:12.5px}
  .tnote{font-size:11.5px;color:var(--muted);margin:5px 2px 0;line-height:1.45}
  /* ---- SES-127 · §10 SKIPPED, WAITING ON YOU --------------------------------------------
     Two cell treatments the mock's §10 needs and no earlier section did. `.unblock` is a real
     control living inside a table cell, so it carries the same 44px tap target every other
     button on this page has — a button John cannot reliably hit on a phone is a button that
     records nothing. `.newchip` is the mock's per-row NEW tag; it is brass-on-card rather than
     navy-on-white so it reads as a marker beside the button and never competes with it. */
  button.unblock{font-family:var(--body);font-weight:600;font-size:12px;padding:7px 9px;
       border-radius:5px;border:1.5px solid var(--brass);background:var(--card-alt);
       color:var(--brass-deep);cursor:pointer;min-height:44px;white-space:nowrap}
  button.unblock:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  button.unblock.on{background:var(--brass);border-color:var(--brass-deep);color:var(--white)}
  button.unblock[disabled]{border-style:dashed;color:var(--muted);cursor:default}
  .newchip{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.7px;
       text-transform:uppercase;color:var(--brass-deep);border:1px solid var(--brass-light);
       border-radius:3px;padding:1px 5px;margin-left:5px;white-space:nowrap}
  td.reason{font-size:12px;color:var(--muted-deep);min-width:200px}
  .budget{background:var(--card);border:1px solid var(--line);border-radius:7px;
          padding:13px 14px;margin-bottom:14px}
  .budget h4{font-family:var(--mono);font-size:10px;letter-spacing:.9px;text-transform:uppercase;
             color:var(--brass-deep);margin:0 0 8px}
  .bar{height:8px;border-radius:4px;background:var(--card-alt);border:1px solid var(--line-soft);
       overflow:hidden;display:flex;margin:6px 0 4px}
  .bar .dev{background:var(--navy);height:100%}
  .bar .qa{background:var(--brass);height:100%}
  /* SES-124 — a bar nobody can read is decoration. Every bar states what it measures. */
  .barlbl{font-family:var(--mono);font-size:9px;letter-spacing:.6px;text-transform:uppercase;
          color:var(--muted);margin-top:2px}
  .recorded{font-family:var(--mono);font-size:11px;color:var(--moss);margin-top:8px}
  .legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:10.5px;
          color:var(--muted-deep);font-variant-numeric:tabular-nums}
  .legend .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:baseline}
  .calib{font-size:12.5px;color:var(--muted-deep);margin:8px 0 0;line-height:1.5}
  .est{font-family:var(--mono);font-size:9px;letter-spacing:.7px;text-transform:uppercase;
       color:var(--muted);border:1px solid var(--line-soft);border-radius:3px;padding:1px 5px;margin-left:6px}
  .readgrid{display:flex;gap:8px;margin-top:9px}
  .readgrid label{flex:1;font-family:var(--mono);font-size:9px;letter-spacing:.6px;
       text-transform:uppercase;color:var(--muted-deep)}
  .readgrid input{width:100%;font-family:var(--mono);font-size:15px;padding:8px 9px;margin-top:3px;

  .yn button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .yn button.yes.on{background:var(--moss);border-color:var(--moss);color:var(--white)}

  .qnote{display:none;margin-top:9px}

  /* v7.0.145, directive edab5908 — More info. John: "often your wording is very confusing and

  .morebtn{width:100%;font-family:var(--body);font-weight:600;font-size:13.5px;padding:9px 4px;

        padding-left:10px;border-left:2px solid var(--line-soft)}
  /* SES-125 — the ask box LEAVES the More-info panel and sits under the buttons on every card
     and every row, always visible. `.got` is the "✓ Received" acknowledgement John asked for:

  .ask{margin-top:10px}
  .ask input{width:100%;font-family:var(--body);font-size:14px;padding:9px 10px;margin-top:9px;
     border:1.5px solid var(--line);border-radius:6px;background:var(--white);color:var(--ink)}
  .ask input:focus-visible{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass)}
  .ask .hint{font-size:10.5px;color:var(--muted);margin-top:3px}
  .ask .got{display:none;font-family:var(--mono);font-size:11px;color:var(--moss);margin-top:4px}
  .ask .got.show{display:block}
  .ynmean{display:flex;gap:8px;margin-top:5px}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="page"></div>

<script type="application/json" id="briefing-state">{"items":{},"directive":"","reading":null,"answers":{},"unblocks":{}}</script>

<script id="code">
// SES-78b v2 — classic artifact: state renders the page; every decision self-publishes a new
// version via claude.use('artifact').publish(fullDoc). Never serializes the live DOM.
(function(){
  var stEl = document.getElementById('briefing-state');
  var state = {items:{}, directive:'', reading:null, answers:{}, asks:{}};
  try { state = JSON.parse(stEl.textContent); } catch(e) {}
  // Recover state stashed before a publish that may not have landed (docs: stash first).
  try {
    var stash = sessionStorage.getItem('briefing-pending');
    if (stash) { state = JSON.parse(stash); }
  } catch(e) {}
  // SES-99: a page published before the question list existed has no `answers` key. Absent is
  // not empty-and-broken — default it, or the first tap throws on an undefined and records
  // nothing, which is the one failure mode a decision surface may never have.
  if (!state.answers || typeof state.answers !== 'object') { state.answers = {}; }
  // v7.0.145 — same defensive default for `asks`, and for the same reason SES-99 needed it:
  // a page published before this key existed must not throw on John's first tap.
  if (!state.asks || typeof state.asks !== 'object') { state.asks = {}; }
  // SES-127 — same defensive default, same reason as SES-99's and v7.0.145's: a page published
  // before §10 existed has no `unblocks` key, and John's first tap on an Unblock button must not
  // throw on an undefined and record nothing.
  if (!state.unblocks || typeof state.unblocks !== 'object') { state.unblocks = {}; }

  var readOnly = false;

  // SES-127 — §10's count chip, written by the rebuilding cycle from the SAME query that
  // produced the rows below it. `n` is open skips on still-open tickets, `nnew` is how many of
  // those have `briefed_at IS NULL`. They live together in one object because the chip's two
  // halves disagreeing with each other — or with the rows — is the exact class of small
  // wrongness that makes the whole page read as unmaintained (SES-124's countWaiting() rule,
  // applied to the one counter that cannot be derived from the DOM).
  var SKIPS = { n:2, nnew:2 };

  function esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                    .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // v7.0.145, directive edab5908 — what each button DOES, in this card's own terms. A cycle may
  // override any of the three; these are the defaults, and they differ by card kind because a
  // gated Accept and a shipped Accept are genuinely different transactions (John's B34 ruling).
  function buttonMeanings(kindCls, over){
    var d = kindCls==='gate'
      ? { accept:'Build it. The ticket goes to the top of the queue. This is permission, not a score — it does not move the trust ladder.',
          reverse:'Do not build it. The proposal is killed and the reason recorded.',
          rework:'Neither yet — your line rewrites the ask and comes back changed.' }
      : { accept:'Keep it. It counts toward the runner’s trust score for this kind of work.',
          reverse:'Undo it. The commit is reverted forward, any data restored from before-images, and the ticket reopens carrying your line.',
          rework:'Keep it live, but your line becomes the next cycle’s first job.' };
    over = over || {};
    return { accept: over.accept || d.accept, reverse: over.reverse || d.reverse,
             rework: over.rework || d.rework };
  }

  // The conversation log for one target, newest last — John's question, then the runner's answer
  // if a cycle has written one. A question with no answer yet says so plainly rather than
  // rendering an empty space that reads like it was ignored.
  function thread(targetId){
    var list = state.asks[targetId] || [];
    if (!list.length) return '';
    var h = '<div class="thread">';
    for (var i=0;i<list.length;i++){
      var t = list[i] || {};
      h += '<p class="qq">You asked · '+esc(t.at||'')+'<br>'+esc(t.q)+'</p>';
      h += t.a ? '<p class="aa">'+esc(t.a)+'</p>'
               : '<p class="pending">Not answered yet — the next cycle answers it here, and keeps this thread.</p>';
    }
    return h + '</div>';
  }

  // SES-125 — the ask box now sits UNDER the buttons, always visible, on cards (§§5/6),
  // questions (§9) and vision claims (§12). John's line counts the same as a tap, so it may not
  // be hidden behind a second button. `got` is the acknowledgement: once anything has been
  // recorded for this target the "✓ Received <ts>" line shows, carrying the time of his most
  // recent line — a typed line that vanishes without a mark reads as a line that was lost.
  function askBox(targetId, placeholder, hint, gotTail){
    var list = state.asks[targetId] || [];
    var last = list.length ? (list[list.length-1] || {}) : null;
    return '<div class="ask"><input type="text" data-ask="'+targetId+'" value="" '
      +'placeholder="'+placeholder+'">'
      +'<div class="hint">'+hint+'</div>'
      +'<div class="got'+(last?' show':'')+'">&#10003; Received '+esc(last?last.at:'')
      +' &middot; '+gotTail+'</div></div>';
  }

  // The three plain-language sentences are the card's DEFAULT BODY now (SES-125 reverses
  // v7.0.145's display). They are still READ from runner_items.plain_cant/.plain_after/
  // .plain_worth and never re-authored here, and a NULL still draws the red defect line rather
  // than a convincing blank — reversing which half is hidden changes neither rule.
  function plainBlock(more){
    return more
      ? '<div class="plain">'
        +'<p><span class="lbl">What you can’t do today</span>'+more.cant+'</p>'
        +'<p><span class="lbl">What you could do after</span>'+more.after+'</p>'
        +'<p><span class="lbl">Why that’s worth something</span>'+more.worth+'</p></div>'
      : '<div class="plain"><p class="missing">This card was published without its '
        +'plain-language summary. That is a defect in the cycle that wrote it, not something '
        +'you need to decode.</p></div>';
  }

  // What each button does, in this card's own terms — rendered as consequence lines directly
  // under the buttons they describe, exactly as §9's Yes/No rows have carried them since
  // v7.0.145. They used to live inside the More-info panel; the panel now holds the technical
  // record (SES-125), and a consequence John has to open a panel to read is one he decides
  // without. Same defaults, same per-card override.
  function decideMeans(kindCls, over){
    var b = buttonMeanings(kindCls, over);
    return '<div class="ynmean"><span>Accept &rarr; '+b.accept+'</span>'
      +'<span>Reverse &rarr; '+b.reverse+'</span>'
      +'<span>Rework &rarr; '+b.rework+'</span></div>';
  }

  // SES-125 — MORE INFO IS THE TECHNICAL RECORD NOW. The display is reversed from v7.0.145:
  // the plain-language sentences are the body John reads first, and Value case / Before → after /
  // QA evidence / meta / links — the material he told us was "too much technical jargon" — moves
  // behind the button. Nothing is deleted; the record is still one tap away and still on the card.
  // Default closed: a card he has asked a question about no longer opens this panel, because the
  // thread and the ask box left the panel and now live under the buttons where he types.
  function techPanel(id, techHtml){
    if (!techHtml) return '';
    return '<button class="morebtn" data-more="'+id+'">More info — the technical record</button>'
      +'<div class="more" id="more-'+id+'">'+techHtml+'</div>';
  }

  // SES-124 — the collapse framework's card helper. One default-closed card: a clickable head
  // (number · title · chevron) over a hidden body. `headExtra` is markup dropped between the
  // number and the title — SES-125 puts the kind chip, ticket ID and decision state there, which
  // is why it is a slot rather than three more arguments this ticket cannot yet fill.
  // It carries NO `data-awaits`: folding is a view state, never a decision John owes.
  function fold(id, num, title, bodyHtml, headExtra){
    return '<div class="item fold" id="'+id+'">'
      +'<div class="head" data-toggle="'+id+'"><span class="cardnum">'+num+'</span>'
      +(headExtra||'')
      +'<span class="ttl">'+title+'</span><span class="chev">&#9656;</span></div>'
      +'<div class="bodyc">'+bodyHtml+'</div></div>';
  }

  // SES-125 — ONE DECISION CARD, §§5 and 6. Default CLOSED, numbered, and the collapsed row
  // carries everything John needs to decide whether to open it: number · kind · TICKET ID ·
  // ticket title · decision state. Arguments, in order:
  //   num      '5.1'                    — the section-relative card number shown in the head
  //   id       'item-LOG-128'           — DOM id AND the runner_items key the harvest writes on
  //   kindCls  'ship' | 'gate' | 'test' — drives the chip colour and the button meanings
  //   kindTxt  'Ship' | 'Gated'         — the chip's word
  //   tid      'LOG-128'                — the ID chip, visible while collapsed (John's rule)
  //   idLine   'LOG-128 (Log · P05 - Enhancements) · behind flag, currently OFF'
  //   title    the board's ticket title — not a re-worded headline
  //   techHtml Value case / Before → after / QA evidence / meta / links, i.e. the record
  //   more     {cant, after, worth, buttons:{…}} read from runner_items.plain_*
  function card(num, id, kindCls, kindTxt, tid, idLine, title, techHtml, more){
    var d = state.items[id] || {};
    var dec = d.decision || '';
    var showReason = dec==='reverse' || dec==='rework';
    // SES-124 — `data-awaits` is how the masthead counter (§1) knows this card still needs John.
    // It is set from STATE, not from the DOM's appearance, so a card that renders collapsed
    // still counts correctly. Every decidable element carries it; nothing else does.
    return '<div class="item fold" id="'+id+'"'+(dec?' data-decision="'+dec+'"':' data-awaits="1"')+'>'
      +'<div class="head" data-toggle="'+id+'"><span class="cardnum">'+num+'</span>'
      +'<span class="kind '+kindCls+'">'+kindTxt+'</span>'
      +'<span class="idchip">'+tid+'</span>'
      +'<span class="ttl">'+title+'</span>'
      +'<span class="st'+(dec?' done':'')+'">'+(dec?(dec.toUpperCase()+' ✓'):'undecided')+'</span>'
      +'<span class="chev">&#9656;</span></div>'
      +'<div class="bodyc">'
      +'<div class="idline">'+idLine+(dec&&d.at?(' &middot; decided '+esc(d.at)):'')+'</div>'
      +plainBlock(more)
      +techPanel(id, techHtml)
      +'<div class="decide">'
      +'<button class="accept'+(dec==='accept'?' on':'')+'" data-c="accept">Accept</button>'
      +'<button class="reverse'+(dec==='reverse'?' on':'')+'" data-c="reverse">Reverse</button>'
      +'<button class="rework'+(dec==='rework'?' on':'')+'" data-c="rework">Rework</button>'
      +'</div>'
      +decideMeans(kindCls, more && more.buttons)
      +'<div class="reason'+(showReason?' show':'')+'">'
      +'<input type="text" value="'+esc(d.reason)+'" placeholder="One line — then press Save">'
      +'<div class="hint">Press Enter or tap Save to record the line.</div></div>'
      +'<div class="verdict">'+(dec?('recorded: '+dec.toUpperCase()+' · '+esc(d.at||'')):'')+'</div>'
      +thread(id)
      +askBox(id, 'Ask or tell me anything about this — then press Enter',
              'Counts the same as the buttons — your line is recorded now and answered on this card next cycle.',
              'answer appears on this card next cycle')
      +'</div></div>';
  }

  // SES-99 — one open row of public.runner_questions. `qid` is the table's stable slug and is
  // the key the harvest writes back on, so it is the DOM id too: the page and the ledger cannot
  // drift apart. Two buttons, no text box in the way — the note is optional and appears only
  // after an answer exists to attach it to.
  // v7.0.145, directive edab5908 — John: "Your yes/no did not clarify that statement … Perhaps
  // make a statement next to the button, so it clarifies it." `yesMeans`/`noMeans` are the
  // consequence of each tap in one line, rendered directly beneath the button that causes it, so
  // the question never has to be re-parsed to work out which way round it runs. They are
  // REQUIRED: a question row without them renders the defect in red rather than two bare buttons.
  // SES-125 — folded, numbered, and the ask box is out of the More-info panel: a question row
  // has no technical record to hide, so the panel it used to carry existed only to hold the ask
  // box, and John had to open a button to answer in his own words. The box is now under the
  // buttons, where the Yes/No is. `opts` is how §12 reuses this row verbatim rather than
  // growing a near-copy — the spec's word is "formatted exactly like Questions", so §9 and §12
  // are one function, not two that must be kept in step:
  //   opts.chip            markup shown before the text in the head (§12's class chip)
  //   opts.ask{ph,hint,got} the ask box's three strings, which differ in meaning for a claim
  function question(num, qid, text, ctx, yesMeans, noMeans, opts){
    var a = state.answers[qid] || {};
    var ans = a.a || '';
    opts = opts || {};
    var ask = opts.ask || { ph:'Ask or answer in your own words — then press Enter',
                            hint:'Counts the same as the buttons — recorded now, answered here next cycle.',
                            got:'answer appears here next cycle' };
    var means = (yesMeans && noMeans)
      ? '<div class="ynmean"><span>Yes &rarr; '+yesMeans+'</span><span>No &rarr; '+noMeans+'</span></div>'
      : '<div class="ynmean"><span class="missing">This question was published without its '
        +'Yes/No consequences — a defect in the cycle that asked it. Ask me what it means in the '
        +'box below rather than guessing.</span></div>';
    return '<div class="q fold" id="'+qid+'"'+(ans?' data-answer="'+ans+'"':' data-awaits="1"')+'>'
      +'<div class="head" data-toggle="'+qid+'"><span class="cardnum">'+num+'</span>'
      +(opts.chip||'')
      +'<span class="qtext">'+text+'</span>'
      +'<span class="st'+(ans?' done':'')+'">'+(ans?(ans.toUpperCase()+' ✓'):(opts.undecidedTxt||'unanswered'))+'</span>'
      +'<span class="chev">&#9656;</span></div>'
      +'<div class="bodyc">'
      +(ctx ? '<p class="qctx">'+ctx+'</p>' : '')
      +'<div class="yn">'
      +'<button class="yes'+(ans==='yes'?' on':'')+'" data-a="yes">Yes</button>'
      +'<button class="no'+(ans==='no'?' on':'')+'" data-a="no">No</button>'
      +'</div>'
      +means
      +'<div class="qnote'+(ans?' show':'')+'">'
      +'<input type="text" value="'+esc(a.note)+'" placeholder="Optional — a line only if you want to add one">'
      +'<div class="hint">Not required. The Yes/No above is already recorded.</div></div>'
      +'<div class="qverdict">'+(ans?('recorded: '+ans.toUpperCase()+' · '+esc(a.at||'')):'')+'</div>'
      +thread(qid)
      +askBox(qid, ask.ph, ask.hint, ask.got)
      +'</div></div>';
  }

  // §12 · A VISION CLAIM (SES-125). Spec: "formatted exactly like Questions" — so it IS a
  // question row, with a class chip in front and the three ask-box strings that fit a claim
  // (John's own wording REPLACES the claim rather than asking about it, which is a different
  // transaction from asking a question and has to say so). Always three rows, always default
  // closed, and a claim reappears every day until it is decided — only silence carries it
  // forward, exactly as silence never decides anything else on this page.
  // `vid` MUST be the `vision-<doc>-<claim id>` form: the harvest reads answers by key, and
  // this is what tells it a row belongs to docs/vision/*.md rather than runner_questions.
  function visionClaim(num, vid, cls, text, ctx, yesMeans, noMeans){
    return question(num, vid, text, ctx, yesMeans, noMeans, {
      chip: '<span class="clschip">'+cls+'</span>',
      undecidedTxt: 'undecided',
      ask: { ph:'Or say it in your own words — then press Enter',
             hint:'Your line replaces the claim, marked as your words — that also resolves it.',
             got:'the claim is rewritten in your words' }
    });
  }

  // SES-126 — the three board-table row helpers (§§8, 11/13, 14). They exist for the same
  // reason `card()` and `question()` do: a table whose rows are hand-written strings drifts a
  // cell at a time, and these are the rows a cycle regenerates on EVERY rebuild. Each escapes
  // its own text — §8 titles and §14 names are ticket prose and visitor labels, i.e. the two
  // places on this page where the content is not written by a cycle.
  function queueRow(q, id, cls, status, design, title){
    return '<tr><td class="num">'+q+'</td><td class="mono">'+esc(id)+'</td>'
      +'<td class="mono dim">'+esc(cls)+'</td><td class="dim">'+esc(status)+'</td>'
      +'<td class="dim">'+esc(design)+'</td><td class="ttl2">'+title+'</td></tr>';
  }
  function classRow(cid, name, n){
    return '<tr><td><span class="mono dim">'+cid+'</span> &nbsp;'+name+'</td>'
      +'<td class="num">'+n+'</td></tr>';
  }
  function ladderRow(cid, work, rung, streak){
    return '<tr><td class="mono dim">'+cid+'</td><td>'+work+'</td>'
      +'<td class="num">'+rung+'</td><td class="num">'+streak+'</td></tr>';
  }
  // SES-127 — ONE §10 ROW. Nine columns, Unblock first (the spec's order: the action comes
  // before the identifiers, because the section exists to be acted on, not read).
  //   sid    the runner_skips row id — the key `state.unblocks` is written under, so a tap
  //          survives the republish and the harvest can find the row it belongs to
  //   unb    'question' | 'prep' | 'card' | null — which button this row gets
  //   ref    the card id a 'card' row points at (rendered as its short id, John taps the card
  //          itself in §5/§6 — the page deliberately does not try to scroll him there)
  //   isNew  briefed_at IS NULL, i.e. skipped since his last brief
  // A row carries NO `data-awaits`: a skipped ticket is information, not a decision John owes,
  // and inflating §1's counter with rows that need no tap is exactly the masthead-disagrees-with
  // -the-page failure SES-124 built countWaiting() to prevent.
  function skipRow(sid, id, cls, q, design, status, title, reason, when, unb, ref, isNew){
    var taken = state.unblocks[sid];
    var label = unb==='question' ? 'Answer as a question'
              : unb==='prep'     ? 'Prep our session'
              : unb==='card'     ? 'Decide on card '+esc(String(ref||'').slice(0,8))
              : 'No action here yet';
    var btn = unb==='card'
      ? '<button class="unblock" disabled>'+label+'</button>'

    // sorted by ZERO-PADDED class id — the same P01…P10 sort §11 uses, and for the same reason.
    // The mapping is fixed and lives here so a rebuild does not re-derive it:
    //   invention → P02 · enhancement → P05 · agent_creation → P07
    //   determinism_removal → P08 · bug_fix → P09 · tooling → P10
    // THE NOTE IS NOT DECORATION: runner_ladder has SIX rows and the board has ten classes, so
    // P6 - Agent Enhancement has no rung at all. Saying so is the honest rendering; a blank row
    // would read as "rung 0, not yet trusted", which is a different and untrue claim.
    // Rows below are this cycle's real values.
    +'<h2><span class="secnum">13</span>Trust ladder</h2><table>'
    +'<tr><th>Class</th><th>Work class</th><th>Rung</th><th>Streak</th></tr>'
    +ladderRow('P02','Invention',0,0)
    +ladderRow('P05','Enhancement',1,0)
    +ladderRow('P07','Agent creation',1,0)
    +ladderRow('P08','Determinism removal',1,0)
    +ladderRow('P09','Bug fix',1,0)
    +ladderRow('P10','Tooling',5,1)
    +'</table>'
    +'<p class="tnote">No ladder row exists for <b>P6 - Agent Enhancement</b> — the ladder tracks '
    +'six work classes and that is not one of them. <b>SES-122</b> (next bucket) is where rungs '
    +'start actually unlocking autonomy.</p>'
    // ===== §14 · WHO USED DEEPBENCH (SES-126) ===============================================
    // Last 5 PRODUCTION uses. Two filters carry this section and both were measured live:
    //   (1) request_host = 'deepbench.roadmapventure.com' — the only production host in
    //       ai_activity_log. The dev URL is John himself (the standing dev-URL=John attribution
    //       rule) and request_host IS NULL covers 12,212 pre-LOG-134 rows with no host recorded,
    //       so any looser filter files the runner's own traffic under "who used DeepBench".
    //   (2) ONE USE = ONE trace_id, not one row. LOG-81's standing rule is that "AI calls" means
    //       real model calls, never raw log rows; the calls count below is
    //       count(*) FILTER (WHERE model IS NOT NULL), so a five-call run reads as one use.
    // Name resolves visitor_labels.user_label → the FIRST CLAUSE of ip_org_cache.user_label →
    // org. That middle step is not fussiness: one live cache label is a 130-character
    // provenance paragraph, and unsliced it becomes the Name column.
    // COST IS '—' AND MUST STAY '—': cost_usd is NULL on every production row today. A NULL
    // rendered as $0.00 is a claim that the run was free, which is a different thing from not
    // knowing — same rule as the plain_* red defect line.
    // The heading says "last 5", not "today", because the most recent production use is Aug 18.
    +'<h2><span class="secnum">14</span>Who used DeepBench — last 5 production uses</h2>'
    +'<div class="tscroll"><table>'
    +'<tr><th>Time (CST)</th><th>IP</th><th>Location</th><th>Name</th><th>What they did</th>'
    +'<th>Cost</th></tr>'
    +useRow('Aug 18, 1:02 PM','146.75.136.146','San Jose, California, US','Suchi','Live agent console — 5 AI calls','—')
    +useRow('Aug 18, 1:01 PM','146.75.136.146','San Jose, California, US','Suchi','Live agent console — 7 AI calls','—')
    +useRow('Aug 18, 1:00 PM','146.75.136.146','San Jose, California, US','Suchi','Live agent console — 4 AI calls','—')
    +useRow('Aug 18, 1:00 PM','146.75.136.146','San Jose, California, US','Private Relay egress','Live agent console — 3 AI calls','—')
    +useRow('Aug 14, 4:56 PM','136.62.184.220','Austin, Texas, US','David','Live agent console — 6 AI calls','—')
    +'</table></div>'
    +'<p class="tnote">Cost shows &ldquo;&mdash;&rdquo; because these runs carry no recorded '
    +'per-call cost &mdash; not because they were free.</p>'
    // SES-124 · REMOVED, on John's explicit instruction: the footer note. It restated the
    // read-only rule that the savebar already states in place, at the moment it matters, and
    // then closed the page on housekeeping instead of on his board. The read-only signal is
    // NOT lost — it lives on `#savebar` above, which is where a failed save reports itself.
    +'</div>';
    wire();
  }

  // Full replacement document, rendered from state — the page's own source as a function.
  function doc(){
    return '<!doctype html>\n<html><head><meta charset="utf-8">'
      +'<meta name="viewport" content="width=device-width,initial-scale=1">'
      +'<title>DeepBench Morning Briefing</title>'
      +document.getElementById('f').outerHTML
      +document.getElementById('s').outerHTML
      +'</head><body><div id="page"></div>'
      +'<script type="application/json" id="briefing-state">'
      +JSON.stringify(state).replace(/</g,'\\u003c')
      +'<\/script>'
      +'<script id="code">'+document.getElementById('code').textContent+'<\/script>'
      +'</body></html>';
  }

  var saving = false;
  function save(){
    if (readOnly || saving) return;
    saving = true;
    bar('saving…');
    try { sessionStorage.setItem('briefing-pending', JSON.stringify(state)); } catch(e) {}
    window.claude.use('artifact').then(function(a){
      if (!a) { readOnly = true; saving=false; bar('read-only view'); return; }
      a.publish(doc()).then(function(){
        try { sessionStorage.removeItem('briefing-pending'); } catch(e) {}
        // View reloads to the new version; nothing else to do.
      }, function(err){
        saving = false;
        var c = err && err.code;
        if (c==='not_writer' || c==='not_granted' || c==='consent_required' ||
            c==='capability_disabled' || c==='capability_removed') {
          readOnly = true; bar('read-only view — decisions record for the owner only');
        } else if (c==='conflict') {
          bar(''); // shell reloads to the winning version
        } else if (c==='rate_limited') {
          bar('too fast — tap again in a moment');
        } else {
          bar('save failed ('+(c||'unknown')+') — tap again to retry');
        }
      });
    });
  }

  function bar(t){ var b=document.getElementById('savebar'); if(b) b.textContent=t; }

  // SES-124 — §1's counter. Counts `data-awaits` elements: every undecided card and unanswered
  // question, and (from SES-125) every undecided vision row, because they all carry the same
  // attribute. Singular at 1 — "1 decisions waiting" is the kind of small wrongness that makes
  // the whole page read as unmaintained. At zero it says so affirmatively rather than "0".
  function countWaiting(){
    var n = document.querySelectorAll('[data-awaits]').length;
    var w = document.getElementById('waiting');
    if (!w) return;
    w.textContent = n ? (n + ' decision' + (n===1?'':'s') + ' waiting') : 'Nothing needs you ✓';
  }

  function wire(){
    countWaiting();
    // SES-124 — the collapse framework's one handler, for BOTH shapes: a folding card
    // (`.item.fold` + `.head[data-toggle]`) and a folding section (`h2.clickable[data-toggle]`
    // + `.secwrap`). It does NOT publish, for the same reason More info does not: a fold is a
    // view state, not a decision, and publishing reloads the view — which would shut the thing
    // John just opened. Nothing about a fold is written to briefing-state.
    document.querySelectorAll('[data-toggle]').forEach(function(h){
      h.addEventListener('click', function(e){
        // A tap on a control inside the head is that control's, never the fold's.
        if (e.target.closest('button,input,textarea,a')) return;
        var el = document.getElementById(h.getAttribute('data-toggle'));
        if (!el) return;
        var open = el.classList.toggle('open');
        var ch = h.querySelector('.chev');
        if (ch) ch.innerHTML = open ? '&#9662;' : '&#9656;';
      });
    });
    // v7.0.145 — More info toggles WITHOUT publishing. Opening a panel is not a decision, and a
    // publish reloads the view, which would slam the panel shut the instant it opened.
    document.querySelectorAll('.morebtn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var panel = document.getElementById('more-'+btn.getAttribute('data-more'));
        if (!panel) return;
        var nowOpen = !panel.classList.contains('show');
        panel.classList.toggle('show', nowOpen);
        btn.classList.toggle('on', nowOpen);
        // SES-125 — the panel is the technical record now, so the label says which record it is.
        btn.textContent = nowOpen ? 'Hide the technical record' : 'More info — the technical record';
      });
    });
    // An ask, on the other hand, IS recorded — same publish path as a tap. Append, never replace:
    // the thread is the log John asked to keep, so a second question is a second entry.
    document.querySelectorAll('.ask input').forEach(function(inp){
      var target = inp.getAttribute('data-ask');
      inp.addEventListener('keydown', function(e){
        if (e.key !== 'Enter') return;
        var q = inp.value.trim();
        if (!q) return;
        if (!state.asks[target]) { state.asks[target] = []; }
        state.asks[target].push({ q:q, at:new Date().toISOString().slice(0,16)+'Z' });
        inp.value = '';
        // SES-125 — acknowledge in place, before the publish round trip. render() will draw the
        // same line from state a moment later; this is what John sees the instant he hits Enter.
        var g = inp.parentElement.querySelector('.got');
        if (g) g.classList.add('show');
        save(); render();
      });
    });
    // SES-127 — §10's Unblock buttons. Recorded like a tap, not like a fold: it IS a decision
    // (it tells the next run to do something), so it publishes. Idempotent by construction —
    // tapping twice records the same intent once, because the harvest is keyed on the skip id
    // and the state entry is replaced rather than appended. A 'card' row's button is disabled:
    // its blocker is already a card in §5/§6 and a second way to decide the same thing is how
    // two half-decisions get made about one ticket.
    document.querySelectorAll('button.unblock[data-skip]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var sid = btn.getAttribute('data-skip');
        state.unblocks[sid] = { kind: btn.getAttribute('data-unb'),
                                at: new Date().toISOString().slice(0,16)+'Z' };
        save(); render();
      });
    });
    document.querySelectorAll('.item').forEach(function(cardEl){
      var id = cardEl.id;
      cardEl.querySelectorAll('.decide button').forEach(function(btn){
        btn.addEventListener('click', function(){
          var c = btn.getAttribute('data-c');
          var cur = state.items[id] || {};
          state.items[id] = { decision:c, reason:(c==='accept'?'':(cur.reason||'')),
                              at:new Date().toISOString().slice(0,16)+'Z' };
          if (c==='accept') { save(); render(); }
          else { render(); var inp=document.querySelector('#'+id+' .reason input'); if(inp) inp.focus(); }
        });
      });
      var inp = cardEl.querySelector('.reason input');
      if (inp) {
        function commit(){
          var cur = state.items[id];
          if (!cur || cur.reason === inp.value) return;
          cur.reason = inp.value; save();
        }
        inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ commit(); } });
        inp.addEventListener('blur', commit);
      }
    });
    // SES-99 — question rows. Same publish path as a card tap: the answer is recorded the
    // instant the thumb lands, and the note is a strictly optional afterthought.
    document.querySelectorAll('.q').forEach(function(qEl){
      var qid = qEl.id;
      qEl.querySelectorAll('.yn button').forEach(function(btn){
        btn.addEventListener('click', function(){
          var cur = state.answers[qid] || {};
          state.answers[qid] = { a:btn.getAttribute('data-a'), note:(cur.note||''),
                                 at:new Date().toISOString().slice(0,16)+'Z' };
          save(); render();
        });
      });
      var ni = qEl.querySelector('.qnote input');
      if (ni) {
        function commitNote(){
          var cur = state.answers[qid];
          if (!cur || cur.note === ni.value) return;
          cur.note = ni.value; save();
        }
        ni.addEventListener('keydown', function(e){ if(e.key==='Enter'){ commitNote(); } });
        ni.addEventListener('blur', commitNote);
      }
    });
    var ta = document.querySelector('.directive textarea');
    if (ta) ta.addEventListener('blur', function(){
      if (state.directive !== ta.value) { state.directive = ta.value; save(); }
    });
    var rs = document.getElementById('r-save');
    if (rs) rs.addEventListener('click', function(){
      var f = document.getElementById('r-fable').value,
          a = document.getElementById('r-all').value,
          h = document.getElementById('r-h5').value;
      if (!f && !a && !h) return;
      state.reading = { fable:f, all:a, h5:h,
                        at:new Date().toISOString().slice(0,16)+'Z' };
      save(); render();
    });
  }

  render();
})();
</script>
